<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="common/header :: head_fragment(title=従業員詳細)"></head>

<body class="h-100 overflow-hidden">
    <div class="row h-100">
        <div class="h-100 p-3 mb-2 bg-dark text-white col-sm-2">
            <nav th:replace="common/side :: copy"></nav>
        </div>
        <div class="mt-3 h-100 col-sm-10">
            <!-- コンテンツ -->
            <div class="container-fluid p-0">
                <h1 class="h3 mb-3">従業員 詳細</h1>

                <div class="row">
                    <div class="col-xl-11">
                        <div class="card">
                            <div class="card-body">
                                <table class="table table-bordered w-50">
                                    <tr>
                                        <th>社員番号</th>
                                        <td th:text="${employee.code}"></td>
                                    </tr>
                                    <tr>
                                        <th>氏名</th>
                                        <td th:text="${employee.name}"></td>
                                    </tr>
                                </table>
                                <div class="mt-3">
                                    <a th:href="@{'/employees/' + ${employee.code} + '/update'}" class="btn btn-warning">更新</a>
                                    <a th:href="@{/employees}" class="btn btn-secondary">一覧へ戻る</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
